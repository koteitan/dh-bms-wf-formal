<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stability-Mountain-Psi Function</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu-wrap">
  <button id="menu-btn" aria-label="menu" aria-expanded="false">☰</button>
  <div id="menu" hidden>
    <label><input type="checkbox" id="dark-toggle"> dark mode</label>
  </div>
</div>

<h1>Stability-Mountain-Psi Function</h1>

<div id="panel">
  <div class="col">
    <label for="in">BMS:</label>
    <textarea id="in" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  </div>
  <div class="arrow">&rarr;</div>
  <div class="col">
    <label for="out">Stability-Mountain-Psi:</label>
    <textarea id="out" rows="3" spellcheck="false" readonly></textarea>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
